[project]
name = "polishare-estudos"
version = "0.1.0"
description = "Baixa o material de uma matéria do Polishare para estudar com o Claude Code"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
]

[project.scripts]
polishare = "polishare.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "typst>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polishare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
